urls:
  taxista: https://azulzinha.qa.portaldocliente.fiserv.com/taxista/
framework:
  logging:
    enableExecutionTracing: true
  playwright:
    browserType: chrome
    context-options:
      useScreenshot: true
      useRecordVideo: false
      useStorageState: false
    cli-options:
      useLocalPlaywrightInstallation: false
      localPlaywrightInstallationPath: '${user.home}\.playwright'
      useCustomNodeJs: false
      customNodeJsPath: 'C:\Program Files\nodejs\node.exe'
      skipBrowserDownload: false
    launch-options:
      # Supported values are "chrome", "chrome-beta", "chrome-dev", "chrome-canary", "msedge", "msedge-beta", "msedge-dev", "msedge-canary"
      channel: chrome
      headless: true
      args:
        - --ignore-certificate-errors
        #- --start-maximized
      # executablePath: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      slowMo: 115 #100
      timeout: 90000 #30000
      # chromiumSandbox: false
      # devtools: false
      # downloadsPath: my/download/path
      # env:
      #   example-key1: example-value1
      #   example-key2: example-value2
      # firefoxUserPrefs:
      #   example-key1: example-value1
      #   example-key2: example-value2
      # handleSIGHUP: true
      # handleSIGINT: true
      # handleSIGTERM: true
      # ignoreAllDefaultArgs: false
      # ignoreDefaultArgs: false
      # proxy:
      #   server: my-server
      #   bypass: my-bypass
      #   username: my-username
      #   password: my-password
      # tracesDir: my/traces/dir